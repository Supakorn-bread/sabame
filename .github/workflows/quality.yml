name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sabame_test
          POSTGRES_USER: sabame
          POSTGRES_PASSWORD: sabame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabame -d sabame_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://sabame:sabame@127.0.0.1:5432/sabame_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
